<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هديتك الخاصة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#F6EEE4; --bone:#FBF6EF; --plum-ink:#2A1620; --burgundy:#6E1E2E;
    --champagne:#C9A66B; --blush:#E4CCC2; --line:rgba(42,22,32,.14);
    --glass-bg:rgba(255,253,249,.62); --glass-border:rgba(201,166,107,.4);
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ivory:#1B1116; --bone:#241620; --plum-ink:#F3E7DE; --burgundy:#E39AA6;
      --champagne:#E8CC86; --blush:#4A2B33; --line:rgba(243,231,222,.14);
      --glass-bg:rgba(36,22,32,.55); --glass-border:rgba(232,204,134,.35);
    }
  }
  :root[data-theme="dark"]{
    --ivory:#1B1116; --bone:#241620; --plum-ink:#F3E7DE; --burgundy:#E39AA6;
    --champagne:#E8CC86; --blush:#4A2B33; --line:rgba(243,231,222,.14);
    --glass-bg:rgba(36,22,32,.55); --glass-border:rgba(232,204,134,.35);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; scroll-padding-top:env(safe-area-inset-top,0px);}
  body{margin:0; background:var(--ivory); color:var(--plum-ink); font-family:'IBM Plex Sans Arabic',sans-serif; font-weight:400; line-height:2; overflow-x:hidden; position:relative;}
  body.locked{height:100%; overflow:hidden;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(1200px 800px at 12% -8%, rgba(201,166,107,.12), transparent 60%),
               radial-gradient(1000px 700px at 108% 8%, rgba(110,30,46,.09), transparent 55%);}
  .rail{position:fixed; top:0; bottom:0; left:34px; width:1px; background:linear-gradient(var(--champagne),transparent 75%); opacity:.55; z-index:2;}
  @media (max-width:900px){.rail{display:none;}}
  .display{font-family:'Aref Ruqaa',serif;}
  img,svg{max-width:100%;}
  .wrap{max-width:860px; margin:0 auto; padding:0 6vw; position:relative; z-index:2;}
  section{padding:min(15vh,130px) 0; position:relative;}
  .reveal{opacity:0; transform:translateY(30px); transition:opacity 1s ease, transform 1s ease;}
  .reveal.in{opacity:1; transform:none;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important;}}

  /* Editorial link-style CTA */
  .cta{position:relative; border:none; background:none; color:var(--champagne); font-family:'Aref Ruqaa',serif; font-size:1.2rem; padding:10px 4px; cursor:pointer; letter-spacing:.4px; transition:color .4s ease;}
  .cta::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:var(--champagne);transform:scaleX(.28);transform-origin:center;transition:transform .5s cubic-bezier(.4,0,.2,1);}
  .cta:hover{color:var(--burgundy);}
  .cta:hover::after{transform:scaleX(1);}

  /* ===== Envelope overlay ===== */
  #envelope-overlay{position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(130% 100% at 50% 15%, #3a1420, var(--plum-ink) 70%); transition:opacity 1.1s ease, visibility 1.1s ease;}
  #envelope-overlay.hide{opacity:0; visibility:hidden; pointer-events:none;}
  .intro{display:flex; flex-direction:column; align-items:center; gap:38px; padding:6vw; text-align:center;}
  .intro-line{font-family:'Aref Ruqaa',serif; font-size:clamp(1.15rem,3.6vw,1.7rem); color:var(--ivory); max-width:19ch; opacity:.92;}
  .scene{perspective:1500px;}
  .envelope{width:min(76vw,300px); aspect-ratio:3/2; position:relative;}
  .env-body{position:absolute; inset:0; background:linear-gradient(160deg,var(--bone),var(--blush) 130%); border:1px solid var(--glass-border); border-radius:5px; box-shadow:0 40px 90px -18px rgba(0,0,0,.55), 0 10px 26px rgba(0,0,0,.3);}
  .env-flap{position:absolute; top:0; left:0; right:0; height:48%; background:linear-gradient(155deg,var(--burgundy),#3f1019); clip-path:polygon(0 0,100% 0,50% 100%); transform-origin:top center; transition:transform 1.15s cubic-bezier(.65,.05,.2,1); z-index:3;}
  .env-seal{position:absolute; top:calc(48% - 21px); left:50%; transform:translateX(-50%); width:40px; height:40px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#e6cf94,var(--champagne) 70%); color:var(--plum-ink); display:flex; align-items:center; justify-content:center; font-family:'Aref Ruqaa',serif; font-size:1.1rem; box-shadow:0 6px 16px rgba(0,0,0,.4); z-index:4;}
  .env-letter{position:absolute; left:9%; right:9%; bottom:7%; top:30%; background:var(--ivory); border-radius:2px; transform:translateY(6%); transition:transform 1.1s ease .12s;}
  .opening .env-flap{transform:rotateX(180deg);}
  .opening .env-letter{transform:translateY(-64%);}

  /* ===== Letter ===== */
  #letter{position:relative;}
  .glyph-bg{position:absolute; top:-10px; right:2vw; font-family:'Aref Ruqaa',serif; font-size:min(30vw,11rem); color:var(--champagne); opacity:.12; z-index:0; user-select:none; line-height:1;}
  #letter .display{font-size:clamp(1.7rem,4.4vw,2.5rem); margin:0 0 46px; color:var(--burgundy); position:relative;}
  #letter-inner{border-right:1px solid var(--glass-border); padding-right:26px;}
  #letter-inner p{font-size:clamp(1.05rem,2vw,1.28rem); max-width:56ch; margin:0 0 24px;}
  .word{opacity:.14; transition:opacity .55s ease;}
  #letter.revealed .word{opacity:1;}

  /* ===== Memories (editorial index) ===== */
  #memories{border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .timeline{margin-top:64px;}
  .mem{display:flex; align-items:baseline; gap:34px; padding:38px 0; border-top:1px solid var(--line);}
  .mem:first-child{border-top:1px solid var(--line);}
  .mem-num{font-family:'Aref Ruqaa',serif; font-size:clamp(2.3rem,6vw,3.5rem); color:var(--champagne); opacity:.6; line-height:1; min-width:64px;}
  .mem-content h3{margin:0 0 8px; font-size:1.4rem; font-family:'Aref Ruqaa',serif; color:var(--burgundy);}
  .mem-content p{margin:0; opacity:.75; max-width:52ch;}
  @media (max-width:600px){.mem{gap:18px;}}

  /* ===== Gallery ===== */
  .gallery{display:grid; grid-template-columns:repeat(6,1fr); grid-auto-rows:112px; gap:14px; margin-top:54px;}
  .tile{position:relative; border-radius:10px; overflow:hidden; cursor:pointer; background:var(--bone); padding:8px; box-shadow:0 20px 44px -20px rgba(0,0,0,.4); transition:transform .5s ease;}
  .tile:hover{transform:translateY(-4px);}
  .tile-inner{position:relative; width:100%; height:100%; border-radius:5px; overflow:hidden;}
  .tile-cap{position:absolute; inset:auto 0 0 0; padding:14px; background:var(--glass-bg); backdrop-filter:blur(10px) saturate(140%); border-top:1px solid var(--glass-border); transform:translateY(105%); transition:transform .45s cubic-bezier(.4,0,.2,1);}
  .tile:hover .tile-cap{transform:translateY(0);}
  .tile-cap span{font-family:'Aref Ruqaa',serif; color:var(--burgundy); font-size:.95rem;}
  .t1 .tile-inner{background:linear-gradient(155deg,var(--blush),var(--bone));} .t2 .tile-inner{background:linear-gradient(155deg,var(--champagne),var(--blush));}
  .t3 .tile-inner{background:linear-gradient(155deg,var(--bone),var(--champagne));} .t4 .tile-inner{background:linear-gradient(155deg,var(--blush),var(--champagne));}
  .t5 .tile-inner{background:linear-gradient(155deg,var(--champagne),var(--bone));} .t6 .tile-inner{background:linear-gradient(155deg,var(--bone),var(--blush));}
  .t1{grid-column:span 4; grid-row:span 2;} .t2{grid-column:span 2; grid-row:span 1;}
  .t3{grid-column:span 2; grid-row:span 2;} .t4{grid-column:span 2; grid-row:span 1;}
  .t5{grid-column:span 3; grid-row:span 1;} .t6{grid-column:span 3; grid-row:span 1;}
  @media (max-width:640px){.gallery{grid-template-columns:repeat(2,1fr); grid-auto-rows:134px;} .t1,.t3{grid-column:span 2;} .t2,.t4,.t5,.t6{grid-column:span 1;}}
  #lightbox{position:fixed; inset:0; background:rgba(20,10,14,.9); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:60; padding:6vw;}
  #lightbox.open{display:flex;}
  #lightbox .box{background:var(--bone); padding:14px; border-radius:12px; box-shadow:0 40px 80px rgba(0,0,0,.5);}
  #lightbox .box-inner{width:min(520px,84vw); aspect-ratio:4/3; border-radius:6px; background:linear-gradient(155deg,var(--blush),var(--champagne)); display:flex; align-items:center; justify-content:center; color:var(--plum-ink); font-family:'Aref Ruqaa',serif; font-size:1.3rem; text-align:center; padding:20px;}
  #lbClose{position:absolute; top:max(24px,env(safe-area-inset-top)); left:24px; color:var(--ivory); background:none; border:1px solid var(--ivory); border-radius:50%; width:40px; height:40px; font-size:1.1rem; cursor:pointer;}

  /* ===== Surprise ===== */
  #surprise{text-align:center;}
  #surprise .lead{font-family:'Aref Ruqaa',serif; font-size:1.5rem; margin-bottom:32px; color:var(--burgundy);}
  .surprise-card{max-width:520px; margin:36px auto 0; padding:0 34px; border-radius:12px; background:var(--glass-bg); backdrop-filter:blur(14px) saturate(140%); border:1px solid var(--glass-border); font-family:'Aref Ruqaa',serif; font-size:1.18rem; color:var(--burgundy); opacity:0; transform:translateY(14px); height:0; overflow:hidden; transition:opacity .8s ease, transform .8s ease;}
  .surprise-card.show{opacity:1; transform:none; height:auto; padding:36px 34px;}

  footer{text-align:center; padding:60px 0 150px; color:var(--plum-ink); opacity:.65; font-family:'Aref Ruqaa',serif; border-top:1px solid var(--line); margin-top:20px;}

  /* ===== Player ===== */
  #player{position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); right:20px; z-index:40; background:var(--glass-bg); backdrop-filter:blur(14px) saturate(140%); border:1px solid var(--glass-border); border-radius:999px; display:flex; align-items:center; gap:10px; padding:9px 18px; box-shadow:0 10px 30px rgba(0,0,0,.18);}
  #playBtn{background:none; border:none; cursor:pointer; font-size:1.05rem; color:var(--burgundy);}
  .bars{display:flex; gap:3px; align-items:flex-end; height:14px;}
  .bars i{width:3px; background:var(--champagne); height:4px; border-radius:2px;}
  #player.playing .bars i{animation:eq 1s ease-in-out infinite;}
  .bars i:nth-child(2){animation-delay:.15s;} .bars i:nth-child(3){animation-delay:.3s;}
  @keyframes eq{0%,100%{height:4px;}50%{height:14px;}}
</style>
</head>
<body class="locked">
<div class="rail"></div>

<div id="envelope-overlay">
  <div class="intro">
    <p class="intro-line" id="introLine"></p>
    <div class="scene">
      <div class="envelope" id="envelope">
        <div class="env-letter"></div>
        <div class="env-body"></div>
        <div class="env-flap"></div>
        <div class="env-seal" id="envSeal">✦</div>
      </div>
    </div>
    <button class="cta" id="openBtn">افتح هديتك ✦</button>
  </div>
</div>

<main id="site">
  <section id="letter">
    <div class="glyph-bg">”</div>
    <div class="wrap">
      <h2 class="display reveal" id="letterHeading"></h2>
      <div id="letterBody"></div>
    </div>
  </section>

  <section id="memories">
    <div class="wrap">
      <h2 class="display reveal" style="text-align:center;color:var(--burgundy)">محطات صغيرة</h2>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <section id="gallery-section">
    <div class="wrap">
      <h2 class="display reveal" style="text-align:center;color:var(--burgundy)">لحظات محفوظة</h2>
      <div class="gallery" id="gallery"></div>
    </div>
  </section>

  <section id="surprise">
    <div class="wrap">
      <p class="lead reveal">هناك شيء آخر أخفيته لك...</p>
      <button class="cta" id="surpriseBtn">اكشف المفاجأة ✦</button>
      <div class="surprise-card" id="surpriseCard"></div>
    </div>
  </section>

  <footer>صُنعت هذه الهدية بكل حب، خصيصًا لك ✦</footer>
</main>

<div id="lightbox">
  <button id="lbClose">✕</button>
  <div class="box"><div class="box-inner" id="lbContent"></div></div>
</div>

<div id="player">
  <button id="playBtn">▶</button>
  <div class="bars"><i></i><i></i><i></i></div>
  <audio id="bgm" loop></audio>
</div>

<script>
const CONFIG = {
  recipientName: "سارة",
  introLine: "إلى شخصٍ يستحق أن تصله هذه الكلمات...",
  letterHeading: "إلى سارة...",
  letterParagraphs: [
    "بعض الأشخاص لا تأتي بهم الحياة صدفة، بل تأتي بهم كأجمل هدية.",
    "وجودك في حياتي جعل بعض الأيام أجمل، وبعض الذكريات أكثر دفئًا.",
    "قد لا تكفي الكلمات لأقول لك كم أنت مميزة، لكنني أردت أن أترك لك شيئًا صغيرًا يذكّرك بذلك."
  ],
  memories: [
    {num:"01", title:"أول لقاء", text:"اللحظة التي بدأت فيها كل الحكاية."},
    {num:"02", title:"أول ذكرى", text:"يوم صغير، تحوّل إلى ذكرى لا تُنسى."},
    {num:"03", title:"لحظة لا تُنسى", text:"وقتٌ توقف فيه الزمن قليلاً."},
    {num:"04", title:"وما زال القادم أجمل...", text:"لأن أجمل الفصول لم تُكتب بعد."}
  ],
  galleryCaptions: ["الذكرى الأولى","لحظة عفوية","معًا","تفصيل صغير","يوم مميز","الابتسامة"],
  surpriseMessage: "هذه الهدية ليست لقيمتها... بل لأن وراءها شخصًا فكّر فيك، في كل تفصيل صغير.",
  audioSrc: ""
};

document.getElementById('introLine').textContent = CONFIG.introLine;
document.getElementById('letterHeading').textContent = CONFIG.letterHeading;
document.getElementById('envSeal').textContent = CONFIG.recipientName ? CONFIG.recipientName[0] : '✦';

const letterBody = document.getElementById('letterBody');
letterBody.id = 'letter-inner';
CONFIG.letterParagraphs.forEach(para=>{
  const p = document.createElement('p');
  para.split(' ').forEach((w,idx)=>{
    const span = document.createElement('span');
    span.className='word'; span.textContent = w + ' ';
    span.style.transitionDelay = (idx*22)+'ms';
    p.appendChild(span);
  });
  letterBody.appendChild(p);
});

const timeline = document.getElementById('timeline');
CONFIG.memories.forEach(m=>{
  const el = document.createElement('div');
  el.className='mem reveal';
  el.innerHTML = `<span class="mem-num">${m.num}</span><div class="mem-content"><h3>${m.title}</h3><p>${m.text}</p></div>`;
  timeline.appendChild(el);
});

const galleryClasses = ['t1','t2','t3','t4','t5','t6'];
const gallery = document.getElementById('gallery');
CONFIG.galleryCaptions.forEach((cap,i)=>{
  const el = document.createElement('div');
  el.className = 'tile reveal ' + (galleryClasses[i]||'');
  el.innerHTML = `<div class="tile-inner"><div class="tile-cap"><span>${cap}</span></div></div>`;
  el.addEventListener('click', ()=>{
    document.getElementById('lbContent').textContent = cap;
    document.getElementById('lightbox').classList.add('open');
  });
  gallery.appendChild(el);
});
document.getElementById('lbClose').addEventListener('click', ()=>document.getElementById('lightbox').classList.remove('open'));

document.getElementById('openBtn').addEventListener('click', ()=>{
  document.getElementById('envelope').classList.add('opening');
  setTimeout(()=>{
    document.getElementById('envelope-overlay').classList.add('hide');
    document.body.classList.remove('locked');
  }, 900);
});

const io = new IntersectionObserver((entries)=>{ entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); } }); },{threshold:.2});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

const letterIo = new IntersectionObserver((entries)=>{ entries.forEach(e=>{ if(e.isIntersecting){ document.getElementById('letter').classList.add('revealed'); }}); },{threshold:.3});
letterIo.observe(document.getElementById('letter'));

document.getElementById('surpriseBtn').addEventListener('click', ()=>{
  const card = document.getElementById('surpriseCard');
  card.textContent = CONFIG.surpriseMessage;
  card.classList.add('show');
});

const audio = document.getElementById('bgm');
if(CONFIG.audioSrc){ audio.src = CONFIG.audioSrc; }
const playBtn = document.getElementById('playBtn');
const player = document.getElementById('player');
playBtn.addEventListener('click', async ()=>{
  try{
    if(audio.paused){ await audio.play(); playBtn.textContent='❚❚'; player.classList.add('playing'); }
    else{ audio.pause(); playBtn.textContent='▶'; player.classList.remove('playing'); }
  }catch(err){ console.warn('لم يتم العثور على ملف صوتي صالح.'); }
});
</script>
</body>
</html>
